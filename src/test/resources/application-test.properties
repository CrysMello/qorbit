spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
scanner.evidencias.path=target/test-evidencias
scanner.timeout.default=5
# H2 não suporta PRAGMAs do SQLite — zera o connection-init-sql do application.properties
spring.datasource.hikari.connection-init-sql=
# Desabilita SQLiteLearningService — usa NoOpLearningService no contexto de teste
qorbit.learning.sqlite.enabled=false
