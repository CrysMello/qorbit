<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Casos de Teste — Qorbit</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        /* ── FILTROS ──────────────────────────────────────────────────── */
        .filters-container {
            background: linear-gradient(135deg, rgba(30, 50, 90, 0.8), rgba(25, 35, 75, 0.85));
            border: 1.5px solid rgba(0, 212, 255, 0.4);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            font-size: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: rgba(100, 120, 180, 0.2);
            border: 1.5px solid rgba(0, 212, 255, 0.3);
            border-radius: 7px;
            padding: 11px 12px 11px 38px;
            color: var(--text-1);
            font-size: 13px;
            outline: none;
        }

        .search-input::placeholder { color: var(--text-3); }

        .search-input:focus {
            border-color: #00d4ff;
            background: rgba(100, 120, 180, 0.25);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
        }

        /* ── LISTA DE CASOS ───────────────────────────────────────────── */
        .casos-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .caso-card {
            background: linear-gradient(135deg, rgba(30, 50, 90, 0.95), rgba(25, 35, 75, 0.9));
            border: 1.5px solid rgba(0, 212, 255, 0.4);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.08);
        }

        .caso-card:hover {
            border-color: #00d4ff;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.15);
            transform: translateY(-2px);
        }

        .caso-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.5);
            background: rgba(15, 26, 61, 0.5);
        }

        .caso-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .caso-id {
            color: #00d4ff;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            min-width: 50px;
        }

        .caso-nome {
            font-size: 15px;
            color: #ffffff;
            font-weight: 600;
        }

        .badge-status {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-status.inativo {
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        .caso-actions {
            display: flex;
            gap: 8px;
            margin-left: 16px;
            flex-shrink: 0;
        }

        .btn-executar {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .btn-executar:hover {
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.5);
            transform: translateY(-1px);
        }

        .btn-editar {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.5);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-editar:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: #60a5fa;
        }

        .btn-deletar {
            background: transparent;
            color: #ef4444;
            border: none;
            font-size: 18px;
            padding: 4px 8px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .btn-deletar:hover { opacity: 1; }

        /* ── METADADOS ────────────────────────────────────────────────── */
        .caso-metadata {
            display: flex;
            gap: 18px;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.5);
            font-size: 13px;
            color: var(--text-3);
            background: rgba(10, 14, 39, 0.3);
        }

        .metadata-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── LISTA DE STEPS ───────────────────────────────────────────── */
        .steps-list {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(10, 14, 39, 0.3);
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #626D81;
            border: 1px solid rgba(100, 140, 200, 0.5);
            border-radius: 7px;
            padding: 12px 14px;
            font-size: 12px;
        }

        .step-number {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        .step-acao-badge {
            background: rgba(16, 185, 129, 0.25);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 700;
            width: 90px;
            text-align: center;
            flex-shrink: 0;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .step-elemento-badge {
            background: rgba(100, 140, 200, 0.3);
            color: #e0e7ff;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            min-width: 130px;
            flex-shrink: 0;
            border: 1px solid rgba(100, 140, 200, 0.5);
        }

        .step-descricao {
            flex: 1;
            color: #e0e7ff;
            font-style: italic;
            text-align: right;
            word-break: break-word;
        }

        /* ── EMPTY STATE ──────────────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
        }

        .empty-state-title {
            font-size: 18px;
            color: var(--text-1);
            margin-bottom: 8px;
        }

        .empty-state-text {
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('casos')}"></div>

    <main class="main-content">
        <div class="topbar">
            <div>
                <h1 class="topbar-title">Casos de Teste</h1>
                <span class="topbar-sub" id="totalLabel">0 casos de teste</span>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-primary btn-sm" onclick="abrirFormNovo()">+ Novo caso de teste</button>
            </div>
        </div>

        <div class="content">
            <!-- FILTROS -->
            <div class="filters-container">
                <div class="search-input-wrapper">
                    <input type="text" class="search-input" id="filtroBusca"
                           placeholder="Buscar por nome..." onkeyup="filtrar()"/>
                </div>
                <select class="input" id="filtroModulo" onchange="filtrar()"
                        style="min-width:180px;padding:10px 14px">
                    <option value="">Módulo</option>
                </select>
                <button class="btn btn-sm" onclick="limparFiltros()">Limpar</button>
            </div>

            <!-- LISTA DE CASOS -->
            <div class="casos-list" id="listaCasos">
                <div class="empty-state">
                    <div class="empty-state-title">Nenhum caso de teste</div>
                    <div class="empty-state-text">Comece criando o seu primeiro teste automatizado</div>
                    <button class="btn btn-primary btn-sm" onclick="abrirFormNovo()">+ Novo caso de teste</button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Formulário criar/editar caso — overlay fixo -->
<div class="card hidden" id="formCaso"
     style="position:fixed;top:60px;left:260px;right:20px;z-index:200;
            max-height:calc(100vh - 80px);overflow-y:auto;
            background:rgba(15,23,42,0.97);border:1px solid #334155;
            border-radius:10px;padding:20px;">
    <div class="card-header">
        <span class="card-title" id="formTitulo">Novo caso de teste</span>
        <button class="btn btn-sm" onclick="fecharForm()">✕ Fechar</button>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="form-group">
            <label>Nome do caso *</label>
            <input type="text" id="fNome" class="input" placeholder="Ex: CadastroCliente completo"/>
        </div>
        <div class="form-group">
            <label>Módulo</label>
            <input type="text" id="fModulo" class="input" placeholder="Ex: Cadastros" list="listaModulos"/>
            <datalist id="listaModulos"></datalist>
        </div>
        <div class="form-group">
            <label>URL alvo</label>
            <input type="url" id="fUrl" class="input" placeholder="https://app.suaempresa.com/pagina"/>
        </div>
        <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="fDescricao" class="input" placeholder="Descrição do cenário"/>
        </div>
    </div>
    <div class="card-header" style="margin-top:16px">
        <span class="card-title">Steps do teste</span>
        <button class="btn btn-sm btn-primary" onclick="adicionarStep()">+ Adicionar step</button>
    </div>
    <div class="helper-text" style="margin-bottom:10px">
        Cada step será uma linha do arquivo .feature (Gherkin) e um método Java no StepDefinitions.
    </div>
    <div id="containerSteps">
        <p class="text-muted text-sm text-center" style="padding:16px" id="semSteps">
            Nenhum step ainda. Clique em "+ Adicionar step" para começar.
        </p>
    </div>
    <div class="form-actions" style="margin-top:16px">
        <button class="btn" onclick="fecharForm()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarCaso()">Salvar caso de teste</button>
    </div>
</div>

<!-- Template de step (clonado dinamicamente) -->
<template id="stepTemplate">
    <div class="step-form-row" data-index="">
        <div class="step-num-badge"></div>
        <select class="input step-acao" style="width:140px;flex-shrink:0">
            <option value="NAVEGAR">Navegar</option>
            <option value="CLICAR">Clicar</option>
            <option value="PREENCHER">Preencher</option>
            <option value="SELECIONAR">Selecionar</option>
            <option value="VALIDAR">Validar</option>
            <option value="LIMPAR">Limpar</option>
        </select>
        <input type="text" class="input step-elemento"
               placeholder="Nome lógico do elemento (ex: BotaoSalvar)" style="flex:1" list="listaElementos"/>
        <input type="text" class="input step-valor"
               placeholder="Valor (para Preencher/Selecionar)" style="width:200px"/>
        <input type="text" class="input step-gherkin"
               placeholder="Texto Gherkin (gerado automático)" style="flex:1"/>
        <button class="btn btn-sm btn-danger" style="flex-shrink:0" onclick="removerStep(this)">✕</button>
    </div>
</template>

<datalist id="listaElementos"></datalist>
<script src="/js/app.js"></script>
<script src="/js/casos.js"></script>
</body>
</html>
