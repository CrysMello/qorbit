<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Casos de Teste — Qorbit</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
<style>
        .nav-item { border-left: 3px solid transparent !important; }
        .nav-item.active { border-left: 3px solid #4F9CF9 !important; background: rgba(79,156,249,.1) !important; }
        .nav-item:hover { background: rgba(255,255,255,.06) !important; }
        </style>
</head>
<body>
<div class="app-layout">
    
    <div th:replace="~{fragments/sidebar :: sidebar('casos')}" ></div>

    <main class="main-content">
        <div class="topbar">
            <div>
                <h1 class="topbar-title">Casos de Teste</h1>
                <span class="topbar-sub" id="totalLabel">Carregando...</span>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-primary" onclick="abrirFormNovo()">+ Novo caso de teste</button>
            </div>
        </div>

        <div class="content">

            <!-- Filtros -->
            <div class="card filter-bar">
                <input type="text" id="filtroBusca" class="input"
                       placeholder="Buscar por nome..." oninput="filtrar()"/>
                <select id="filtroModulo" class="input" onchange="filtrar()">
                    <option value="">Módulo: Todos</option>
                </select>
                <button class="btn" onclick="limparFiltros()">Limpar</button>
            </div>

            <!-- Lista de casos -->
            <div id="listaCasos"></div>

            <!-- Formulário novo/editar caso -->
            <div class="card hidden" id="formCaso">
                <div class="card-header">
                    <span class="card-title" id="formTitulo">Novo caso de teste</span>
                    <button class="btn btn-sm" onclick="fecharForm()">✕ Fechar</button>
                </div>

                <div class="form-grid" style="grid-template-columns:1fr 1fr">
                    <div class="form-group">
                        <label>Nome do caso *</label>
                        <input type="text" id="fNome" class="input" placeholder="Ex: CadastroCliente completo"/>
                    </div>
                    <div class="form-group">
                        <label>Módulo</label>
                        <input type="text" id="fModulo" class="input" placeholder="Ex: Cadastros" list="listaModulos"/>
                        <datalist id="listaModulos"></datalist>
                    </div>
                    <div class="form-group">
                        <label>URL alvo</label>
                        <input type="url" id="fUrl" class="input" placeholder="https://app.suaempresa.com/pagina"/>
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" id="fDescricao" class="input" placeholder="Descrição do cenário"/>
                    </div>
                </div>

                <!-- Steps -->
                <div class="card-header" style="margin-top:16px">
                    <span class="card-title">Steps do teste</span>
                    <button class="btn btn-sm btn-primary" onclick="adicionarStep()">+ Adicionar step</button>
                </div>
                <div class="helper-text" style="margin-bottom:10px">
                    Cada step será uma linha do arquivo .feature (Gherkin) e um método Java no StepDefinitions.
                </div>

                <div id="containerSteps">
                    <p class="text-muted text-sm text-center" style="padding:16px" id="semSteps">
                        Nenhum step ainda. Clique em "+ Adicionar step" para começar.
                    </p>
                </div>

                <div class="form-actions" style="margin-top:16px">
                    <button class="btn" onclick="fecharForm()">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarCaso()">Salvar caso de teste</button>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Template de um step (clonado dinamicamente) -->
<template id="stepTemplate">
    <div class="step-form-row" data-index="">
        <div class="step-num-badge"></div>
        <select class="input step-acao" style="width:140px;flex-shrink:0">
            <option value="NAVEGAR">Navegar</option>
            <option value="CLICAR">Clicar</option>
            <option value="PREENCHER">Preencher</option>
            <option value="SELECIONAR">Selecionar</option>
            <option value="VALIDAR">Validar</option>
            <option value="LIMPAR">Limpar</option>
        </select>
        <input type="text" class="input step-elemento"
               placeholder="Nome lógico do elemento (ex: BotaoSalvar)" style="flex:1" list="listaElementos"/>
        <input type="text" class="input step-valor"
               placeholder="Valor (para Preencher/Selecionar)" style="width:200px"/>
        <input type="text" class="input step-gherkin"
               placeholder="Texto Gherkin (gerado automático)" style="flex:1"/>
        <button class="btn btn-sm" style="color:#DC2626;flex-shrink:0" onclick="removerStep(this)">✕</button>
    </div>
</template>

<datalist id="listaElementos"></datalist>

<script src="/js/app.js"></script>
<script src="/js/casos.js"></script>
</body>
</html>
