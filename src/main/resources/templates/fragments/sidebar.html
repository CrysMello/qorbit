<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<body>

<!--
  Fragment: sidebar
  Parâmetro: activeItem — nome da página ativa.
  Valores: dashboard | nova-execucao | elementos | casos | suites |
           gravar-teste | execucoes | evidencias | gerar-codigo |
           ai-plugin | admin-usuarios
-->
<aside th:fragment="sidebar(activeItem)" class="sidebar">

    <!-- Logo -->
    <div class="sidebar-logo">
        <svg width="34" height="34" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-label="Qorbit logo">
            <rect width="256" height="256" rx="52" fill="#1D3A6B"/>
            <circle cx="128" cy="108" r="38" fill="none" stroke="#3B82F6" stroke-width="10"/>
            <circle cx="128" cy="108" r="16" fill="#3B82F6"/>
            <rect x="148" y="128" width="10" height="46" rx="5" fill="#3B82F6" transform="rotate(45 153 151)"/>
            <circle cx="128" cy="60" r="7" fill="#93C5FD" opacity="0.8"/>
            <circle cx="170" cy="80" r="5" fill="#93C5FD" opacity="0.55"/>
            <circle cx="86"  cy="80" r="5" fill="#93C5FD" opacity="0.55"/>
        </svg>
        <div>
            <span class="logo-title">Qorbit</span>
            <span class="logo-sub">v2.0</span>
        </div>
    </div>

    <!-- Navegação -->
    <nav>
        <div class="nav-section">Principal</div>
        <a href="/" class="nav-item" th:classappend="${activeItem == 'dashboard'} ? ' active'">
            <span class="nav-icon">⊞</span> Dashboard
        </a>
        <a href="/nova-execucao" class="nav-item" th:classappend="${activeItem == 'nova-execucao'} ? ' active'">
            <span class="nav-icon">▷</span> Nova execução
        </a>

        <div class="nav-section">Biblioteca</div>
        <a href="/elementos" class="nav-item" th:classappend="${activeItem == 'elementos'} ? ' active'">
            <span class="nav-icon">◈</span> Elementos (POM)
        </a>
        <a href="/casos" class="nav-item" th:classappend="${activeItem == 'casos'} ? ' active'">
            <span class="nav-icon">≡</span> Casos de teste
        </a>
        <a href="/suites" class="nav-item" th:classappend="${activeItem == 'suites'} ? ' active'"
           style="color: #A78BFA">
            <span class="nav-icon">▪</span> Suites
        </a>

        <div class="nav-section">Gravar</div>
        <a href="/gravar-teste" class="nav-item" th:classappend="${activeItem == 'gravar-teste'} ? ' active'">
            <span class="nav-icon">◉</span> Gravar teste
        </a>

        <div class="nav-section">Resultados</div>
        <a href="/execucoes" class="nav-item" th:classappend="${activeItem == 'execucoes'} ? ' active'">
            <span class="nav-icon">◷</span> Execuções
        </a>
        <a href="/evidencias" class="nav-item" th:classappend="${activeItem == 'evidencias'} ? ' active'">
            <span class="nav-icon">◻</span> Evidências
        </a>
        <a href="/gerar-codigo" class="nav-item" th:classappend="${activeItem == 'gerar-codigo'} ? ' active'">
            <span class="nav-icon">&lt;/&gt;</span> Gerar código
        </a>

        <div class="nav-section">Inteligência</div>
        <a href="/ai-plugin" class="nav-item" th:classappend="${activeItem == 'ai-plugin'} ? ' active'"
           style="color: #A78BFA">
            <span class="nav-icon">✦</span> Plugin IA
        </a>

        <!-- Administração: visível apenas para SUPER_ADMIN -->
        <div sec:authorize="hasRole('SUPER_ADMIN')">
            <div class="nav-section">Administração</div>
            <a href="/admin/usuarios" class="nav-item" th:classappend="${activeItem == 'admin-usuarios'} ? ' active'">
                <span class="nav-icon">⊛</span> Usuários
            </a>
        </div>
    </nav>

    <!-- Status Selenium -->
    <div class="sidebar-status">
        <span class="status-dot" id="seleniumStatus"></span>
        <span id="seleniumLabel" style="font-size:10px">Verificando...</span>
    </div>

    <!-- Card do usuário logado -->
    <div class="sidebar-user">
        <div class="user-avatar" th:text="${#authentication?.name?.substring(0,1)?.toUpperCase() ?: 'U'}">U</div>
        <div class="user-info">
            <span class="user-email" th:text="${#authentication?.name}">usuario@email.com</span>
            <span class="user-role"
                  th:with="role=${#authentication?.authorities?.iterator()?.next()?.authority?.replace('ROLE_','') ?: 'USER'}"
                  th:text="${role}"
                  th:classappend="${role == 'SUPER_ADMIN'} ? ' role-super-admin' : (${role == 'ADMIN'} ? ' role-admin' : ' role-user')">
                USER
            </span>
        </div>
    </div>

</aside>
</body>
</html>
