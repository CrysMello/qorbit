<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — Qorbit</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0A0E1A 0%, #0D1B2A 50%, #0A1628 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: radial-gradient(circle at 20% 20%, rgba(99,102,241,0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        .card {
            width: 100%; max-width: 440px;
            background: rgba(17,24,39,0.95);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 16px; padding: 2.5rem 2rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative; z-index: 1;
        }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #6366F1, #818CF8);
            border-radius: 12px; margin-bottom: 0.6rem;
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        }
        .logo-icon svg { width: 26px; height: 26px; fill: white; }
        .logo-name { font-size: 1.4rem; font-weight: 700; color: #F9FAFB; }
        .logo-name span { color: #6366F1; }
        .heading { text-align: center; margin-bottom: 1.5rem; }
        .heading h1 { font-size: 1.2rem; font-weight: 600; color: #F9FAFB; margin-bottom: 0.25rem; }
        .heading p { font-size: 0.875rem; color: #6B7280; }
        .alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; }
        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.8125rem; font-weight: 500; color: #9CA3AF; margin-bottom: 0.35rem; }
        .form-input {
            width: 100%; padding: 0.65rem 0.875rem;
            background: #1F2937; border: 1px solid #374151;
            border-radius: 8px; color: #F9FAFB; font-size: 0.9375rem;
            transition: border-color 0.15s, box-shadow 0.15s; outline: none;
        }
        .form-input:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .form-input::placeholder { color: #4B5563; }
        .input-wrapper { position: relative; }
        .toggle-password {
            position: absolute; right: 0.875rem; top: 50%;
            transform: translateY(-50%); background: none; border: none;
            color: #6B7280; cursor: pointer; padding: 0;
        }
        .toggle-password:hover { color: #9CA3AF; }
        .password-strength { margin-top: 0.4rem; }
        .strength-bar { height: 3px; border-radius: 2px; background: #374151; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }
        .strength-text { font-size: 0.75rem; color: #6B7280; margin-top: 0.25rem; }
        .honeypot { display: none !important; }
        .btn-primary {
            width: 100%; padding: 0.75rem;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: white; border: none; border-radius: 8px;
            font-size: 0.9375rem; font-weight: 600; cursor: pointer;
            transition: opacity 0.15s; box-shadow: 0 4px 14px rgba(99,102,241,0.35);
            position: relative; margin-top: 0.5rem;
        }
        .btn-primary:hover:not(:disabled) { opacity: 0.92; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary.loading::after {
            content: ''; position: absolute; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; right: 1rem; top: 50%;
            transform: translateY(-50%); animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
        .card-footer { text-align: center; margin-top: 1.25rem; font-size: 0.8125rem; color: #6B7280; }
        .link { color: #6366F1; text-decoration: none; }
        .link:hover { color: #818CF8; text-decoration: underline; }
        .terms { font-size: 0.75rem; color: #6B7280; text-align: center; margin-top: 0.75rem; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="logo-name">Q<span>orbit</span></div>
    </div>
    <div class="heading">
        <h1>Criar conta</h1>
        <p>Comece a automatizar seus testes hoje</p>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}"
          onsubmit="handleSubmit(this)">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label class="form-label">Nome completo</label>
            <input type="text" class="form-input" th:field="*{fullName}"
                   placeholder="Seu nome" autofocus autocomplete="name" required/>
        </div>
        <div class="form-group">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-input" th:field="*{email}"
                   placeholder="seu@email.com" autocomplete="email" required/>
        </div>
        <div class="form-group">
            <label class="form-label">Senha</label>
            <div class="input-wrapper">
                <input id="pwd" type="password" class="form-input" th:field="*{password}"
                       placeholder="Mínimo 8 caracteres" autocomplete="new-password"
                       oninput="checkStrength(this.value)" required style="padding-right:2.75rem"/>
                <button type="button" class="toggle-password"
                        onclick="togglePassword('pwd', this)" tabindex="-1">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="password-strength">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-text" id="strengthText"></div>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Confirmar senha</label>
            <div class="input-wrapper">
                <input id="pwd2" type="password" class="form-input" th:field="*{passwordConfirm}"
                       placeholder="Repita a senha" autocomplete="new-password"
                       required style="padding-right:2.75rem"/>
                <button type="button" class="toggle-password"
                        onclick="togglePassword('pwd2', this)" tabindex="-1">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>

        <!-- Honeypot anti-bot (invisível) -->
        <div class="honeypot" aria-hidden="true">
            <input type="text" th:field="*{honeypot}" tabindex="-1" autocomplete="off"/>
        </div>

        <button type="submit" class="btn-primary">Criar conta</button>
        <div class="terms">Ao criar conta você concorda com os Termos de Uso do Qorbit.</div>
    </form>

    <div class="card-footer">
        Já tem conta? <a href="/auth/login" class="link">Entrar</a>
    </div>
</div>

<script>
    function handleSubmit(form) {
        const btn = form.querySelector('.btn-primary');
        if (btn) { btn.disabled = true; btn.classList.add('loading'); }
    }
    function togglePassword(id, btn) {
        const f = document.getElementById(id);
        f.type = f.type === 'text' ? 'password' : 'text';
    }
    function checkStrength(val) {
        const fill = document.getElementById('strengthFill');
        const text = document.getElementById('strengthText');
        if (!fill || !text) return;
        let score = 0;
        if (val.length >= 8) score++;
        if (val.length >= 12) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const levels = [
            { pct: '20%', color: '#EF4444', label: 'Muito fraca' },
            { pct: '40%', color: '#F97316', label: 'Fraca' },
            { pct: '60%', color: '#EAB308', label: 'Razoável' },
            { pct: '80%', color: '#22C55E', label: 'Forte' },
            { pct: '100%', color: '#10B981', label: 'Muito forte' }
        ];
        const lvl = levels[Math.min(score, 4)];
        fill.style.width = val ? lvl.pct : '0';
        fill.style.background = lvl.color;
        text.textContent = val ? lvl.label : '';
        text.style.color = lvl.color;
    }
</script>
</body>
</html>
