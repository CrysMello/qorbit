<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha — Qorbit</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue:        #3B82F6;
            --blue-dark:   #1D4ED8;
            --blue-light:  #60A5FA;
            --blue-glow:   rgba(59, 130, 246, 0.45);
            --glass-bg:    rgba(6, 12, 30, 0.72);
            --glass-border:rgba(59, 130, 246, 0.22);
            --surface:     rgba(12, 20, 45, 0.85);
            --text-1:      #EFF6FF;
            --text-2:      #93C5FD;
            --text-3:      #64748B;
            --red:         #F87171;
            --green:       #34D399;
            --font:        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        }

        html, body { min-height: 100vh; overflow-x: hidden; }

        body {
            font-family: var(--font);
            background: #020817;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* ── Canvas starfield ── */
        #starCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ── Nebula overlays ── */
        .nebula {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(80px);
        }
        .nebula-1 {
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(29,78,216,.18) 0%, transparent 70%);
            top: -200px; left: -200px;
            animation: pulse 9s ease-in-out infinite;
        }
        .nebula-2 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, rgba(109,40,217,.12) 0%, transparent 70%);
            bottom: -150px; right: -150px;
            animation: pulse 11s ease-in-out infinite 2s reverse;
        }
        .nebula-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(59,130,246,.10) 0%, transparent 70%);
            top: 40%; right: 10%;
            animation: pulse 13s ease-in-out infinite 5s;
        }
        @keyframes pulse {
            0%, 100% { opacity: .7; transform: scale(1); }
            50%       { opacity: 1; transform: scale(1.08); }
        }

        /* ── Logo ── */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .75rem;
        }

        /* ── Layout ── */
        .page-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.75rem;
        }

        /* ── Card ── */
        .card {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.25rem 2rem 2rem;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 0 0 1px rgba(59,130,246,.08),
                0 30px 60px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.04);
            animation: cardIn .5s cubic-bezier(.22,.68,0,1.2) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(.98); }
            to   { opacity: 1; transform: none; }
        }

        /* ── Card heading ── */
        .card-heading { text-align: center; margin-bottom: 1.75rem; }
        .card-heading h1 {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: .3rem;
            letter-spacing: -.02em;
        }
        .card-heading p {
            font-size: .875rem;
            color: var(--text-3);
            line-height: 1.55;
        }

        /* ── Alerts ── */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: .5rem;
            padding: .75rem 1rem;
            border-radius: 10px;
            font-size: .8375rem;
            margin-bottom: 1.25rem;
            line-height: 1.45;
        }
        .alert svg { flex-shrink: 0; margin-top: .1rem; }
        .alert-success { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.28); color: #6EE7B7; }
        .alert-error   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.28);  color: #FCA5A5; }

        /* ── Form ── */
        .form-group { margin-bottom: 1.1rem; }
        .form-label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: .45rem;
            letter-spacing: .01em;
        }

        .input-wrap { position: relative; }
        .input-icon {
            position: absolute;
            left: .9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            pointer-events: none;
            transition: color .2s;
        }
        .input-wrap:focus-within .input-icon { color: var(--blue-light); }

        .form-input {
            width: 100%;
            padding: .7rem .875rem .7rem 2.65rem;
            background: transparent;
            border: 1px solid rgba(71,85,105,.5);
            border-radius: 10px;
            color: var(--text-1);
            font-size: .9375rem;
            font-family: var(--font);
            transition: border-color .2s, box-shadow .2s;
            outline: none;
        }
        .form-input::placeholder { color: var(--text-3); }
        .form-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,.18), 0 0 12px rgba(59,130,246,.12);
        }

        /* ── Voltar ── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            font-size: .8125rem;
            color: var(--text-3);
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: color .2s;
        }
        .back-link:hover { color: var(--text-2); }

        /* ── Botão principal ── */
        .btn-primary {
            width: 100%;
            padding: .78rem;
            background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 60%, var(--blue-light) 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: .9375rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: box-shadow .25s, transform .1s;
            box-shadow: 0 4px 18px rgba(59,130,246,.4), 0 0 0 1px rgba(59,130,246,.25);
            letter-spacing: .01em;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.12), transparent);
            opacity: 0;
            transition: opacity .25s;
        }
        .btn-primary:hover:not(:disabled)::before { opacity: 1; }
        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 28px rgba(59,130,246,.6), 0 0 20px rgba(59,130,246,.3);
            transform: translateY(-1px);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0) scale(.99); }
        .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

        /* ── Rodapé do card ── */
        .card-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .8125rem;
            color: var(--text-3);
        }
        .link {
            font-size: .8125rem;
            color: var(--blue-light);
            text-decoration: none;
            transition: color .2s, text-shadow .2s;
        }
        .link:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--blue-glow);
        }

        /* ── Responsivo ── */
        @media (max-width: 480px) {
            .card { padding: 1.75rem 1.25rem 1.5rem; border-radius: 16px; }
        }
    </style>
</head>
<body>

<!-- Fundo espacial -->
<canvas id="starCanvas"></canvas>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<!-- Logo fora do page-wrapper → fica no stacking context raiz, funde com o canvas da galáxia -->
<div class="brand" style="margin-bottom:1.5rem">
    <img src="/images/Logo.jpg" alt="Qorbit Logo"
         style="width:240px;height:auto;object-fit:contain;
                mix-blend-mode:screen;opacity:0.97;
                filter:brightness(1.25) contrast(1.1) saturate(1.15)
                       drop-shadow(0 0 22px rgba(96,165,250,0.6));
                -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 50%,
                    black 30%, rgba(0,0,0,0.85) 50%, rgba(0,0,0,0.4) 68%, transparent 85%);
                mask-image: radial-gradient(ellipse 85% 75% at 50% 50%,
                    black 30%, rgba(0,0,0,0.85) 50%, rgba(0,0,0,0.4) 68%, transparent 85%);"/>
</div>

<div class="page-wrapper">
    <div class="card">

        <a th:href="@{/auth/login}" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Voltar ao login
        </a>

        <div class="card-heading">
            <h1>Recuperar senha</h1>
            <p>Digite seu e-mail e enviaremos as instruções para criar uma nova senha.</p>
        </div>

        <div th:if="${success}" class="alert alert-success">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/auth/forgot-password}" method="post"
              th:object="${forgotRequest}" th:unless="${success}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label">E-mail cadastrado</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </span>
                    <input type="email" class="form-input" th:field="*{email}"
                           placeholder="seuemail@dominio.com"
                           autofocus autocomplete="email" required/>
                </div>
            </div>

            <button type="submit" class="btn-primary">Enviar instruções</button>
        </form>

        <div class="card-footer">
            Lembrou a senha?&nbsp;<a th:href="@{/auth/login}" class="link">Voltar ao login</a>
        </div>

    </div>
</div>

<script>
/* ── Starfield ── */
(function () {
    const canvas = document.getElementById('starCanvas');
    const ctx    = canvas.getContext('2d');
    let W, H, stars;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        initStars();
    }

    function rand(min, max) { return Math.random() * (max - min) + min; }

    function initStars() {
        const count = Math.floor((W * H) / 3200);
        stars = Array.from({ length: count }, () => ({
            x:  rand(0, W),
            y:  rand(0, H),
            r:  rand(.3, 1.6),
            a:  rand(.2, 1),
            da: rand(.0003, .0012) * (Math.random() < .5 ? 1 : -1),
            vx: rand(-.04, .04),
            vy: rand(-.04, .04),
        }));
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
            s.a += s.da;
            if (s.a <= .15 || s.a >= 1) s.da = -s.da;
            s.x += s.vx;
            s.y += s.vy;
            if (s.x < 0) s.x = W;
            if (s.x > W) s.x = 0;
            if (s.y < 0) s.y = H;
            if (s.y > H) s.y = 0;

            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(200,220,255,${s.a})`;
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
})();
</script>
</body>
</html>
