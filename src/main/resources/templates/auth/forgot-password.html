<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha — Qorbit</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0A0E1A 0%, #0D1B2A 50%, #0A1628 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }
        .card {
            width: 100%; max-width: 400px;
            background: rgba(17,24,39,0.95);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 16px; padding: 2.5rem 2rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #6366F1, #818CF8);
            border-radius: 12px; margin-bottom: 0.5rem;
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        }
        .logo-icon svg { width: 26px; height: 26px; fill: white; }
        .logo-name { font-size: 1.4rem; font-weight: 700; color: #F9FAFB; }
        .logo-name span { color: #6366F1; }
        .heading { text-align: center; margin-bottom: 1.5rem; }
        .heading h1 { font-size: 1.2rem; font-weight: 600; color: #F9FAFB; margin-bottom: 0.35rem; }
        .heading p { font-size: 0.875rem; color: #6B7280; line-height: 1.5; }
        .alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1.25rem; }
        .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6EE7B7; }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.8125rem; font-weight: 500; color: #9CA3AF; margin-bottom: 0.4rem; }
        .form-input {
            width: 100%; padding: 0.65rem 0.875rem;
            background: #1F2937; border: 1px solid #374151;
            border-radius: 8px; color: #F9FAFB; font-size: 0.9375rem;
            outline: none; transition: border-color 0.15s;
        }
        .form-input:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .btn-primary {
            width: 100%; padding: 0.75rem;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: white; border: none; border-radius: 8px;
            font-size: 0.9375rem; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 14px rgba(99,102,241,0.35);
            transition: opacity 0.15s;
        }
        .btn-primary:hover { opacity: 0.92; }
        .back-link {
            display: flex; align-items: center; gap: 0.35rem;
            font-size: 0.8125rem; color: #6B7280; text-decoration: none;
            margin-bottom: 1.5rem; transition: color 0.15s;
        }
        .back-link:hover { color: #9CA3AF; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="logo-name">Q<span>orbit</span></div>
    </div>

    <a href="/auth/login" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar ao login
    </a>

    <div class="heading">
        <h1>Recuperar senha</h1>
        <p>Digite seu e-mail e enviaremos as instruções para criar uma nova senha.</p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/auth/forgot-password}" method="post"
          th:object="${forgotRequest}" th:unless="${success}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
            <label class="form-label">E-mail cadastrado</label>
            <input type="email" class="form-input" th:field="*{email}"
                   placeholder="seu@email.com" autofocus autocomplete="email" required/>
        </div>
        <button type="submit" class="btn-primary">Enviar instruções</button>
    </form>
</div>
</body>
</html>
