<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação MFA — Qorbit</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0A0E1A 0%, #0D1B2A 50%, #0A1628 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }
        .card {
            width: 100%; max-width: 380px;
            background: rgba(17,24,39,0.95);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 16px; padding: 2.5rem 2rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #6366F1, #818CF8);
            border-radius: 14px; margin-bottom: 0.6rem;
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        }
        .logo-icon svg { width: 28px; height: 28px; fill: white; }
        .logo-name { font-size: 1.4rem; font-weight: 700; color: #F9FAFB; }
        .logo-name span { color: #6366F1; }
        .shield-icon {
            text-align: center; margin-bottom: 1.25rem;
        }
        .shield-icon svg { color: #6366F1; }
        .heading { text-align: center; margin-bottom: 1.5rem; }
        .heading h1 { font-size: 1.2rem; font-weight: 600; color: #F9FAFB; margin-bottom: 0.35rem; }
        .heading p { font-size: 0.875rem; color: #6B7280; }
        .alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; }
        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.8125rem; font-weight: 500; color: #9CA3AF; margin-bottom: 0.4rem; text-align: center; }
        .code-input {
            width: 100%; padding: 0.875rem;
            background: #1F2937; border: 1px solid #374151;
            border-radius: 8px; color: #F9FAFB;
            font-size: 1.75rem; font-family: monospace; font-weight: 700;
            text-align: center; letter-spacing: 0.5rem;
            transition: border-color 0.15s, box-shadow 0.15s; outline: none;
        }
        .code-input:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .code-input::placeholder { color: #374151; letter-spacing: 0.3rem; }
        .btn-primary {
            width: 100%; padding: 0.75rem;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: white; border: none; border-radius: 8px;
            font-size: 0.9375rem; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 14px rgba(99,102,241,0.35);
            position: relative; transition: opacity 0.15s;
        }
        .btn-primary:hover:not(:disabled) { opacity: 0.92; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary.loading::after {
            content: ''; position: absolute; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; right: 1rem; top: 50%;
            transform: translateY(-50%); animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
        .hint { font-size: 0.8rem; color: #6B7280; text-align: center; margin-top: 1rem; }
        .link { color: #6366F1; text-decoration: none; }
        .link:hover { color: #818CF8; text-decoration: underline; }
        .back-link {
            display: flex; align-items: center; gap: 0.35rem;
            font-size: 0.8125rem; color: #6B7280; text-decoration: none;
            margin-bottom: 1.5rem; transition: color 0.15s;
        }
        .back-link:hover { color: #9CA3AF; }
        .timer { font-size: 0.8rem; color: #6B7280; text-align: center; margin-top: 0.5rem; }
        .timer span { color: #6366F1; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="logo-name">Q<span>orbit</span></div>
    </div>

    <a href="/auth/login" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar
    </a>

    <div class="heading">
        <h1>Verificação em 2 etapas</h1>
        <p>Abra seu app autenticador e<br>insira o código de 6 dígitos</p>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/auth/mfa}" method="post" onsubmit="handleSubmit(this)">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="useBackupCode" id="useBackupCode" value="false"/>

        <div class="form-group">
            <label class="form-label">Código de 6 dígitos</label>
            <input id="codeInput" type="text" name="code" class="code-input"
                   placeholder="000000" maxlength="8" autofocus
                   autocomplete="one-time-code" inputmode="numeric" required
                   oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
        </div>

        <div class="timer">Código expira em <span id="countdown">30</span>s</div>

        <button type="submit" class="btn-primary" style="margin-top:1rem">Verificar</button>
    </form>

    <div class="hint">
        Sem acesso ao app?
        <a href="#" class="link" onclick="switchToBackup(event)">Usar código de backup</a>
    </div>
</div>

<script>
    // Contador TOTP (30s)
    function updateCountdown() {
        const el = document.getElementById('countdown');
        if (!el) return;
        const seconds = 30 - (Math.floor(Date.now() / 1000) % 30);
        el.textContent = seconds;
        if (seconds <= 5) el.style.color = '#EF4444';
        else el.style.color = '#6366F1';
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    function handleSubmit(form) {
        const btn = form.querySelector('.btn-primary');
        if (btn) { btn.disabled = true; btn.classList.add('loading'); }
    }

    function switchToBackup(e) {
        e.preventDefault();
        document.getElementById('useBackupCode').value = 'true';
        const inp = document.getElementById('codeInput');
        inp.placeholder = 'XXXXXXXX';
        inp.inputMode = 'text';
        inp.maxLength = 10;
        inp.removeAttribute('oninput');
        inp.value = '';
        inp.focus();
        document.querySelector('.hint').textContent = 'Código de backup: 8 caracteres alfanuméricos.';
        document.querySelector('.form-label').textContent = 'Código de backup';
        document.querySelector('.timer').style.display = 'none';
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') document.querySelector('form').requestSubmit();
    });
</script>
</body>
</html>
