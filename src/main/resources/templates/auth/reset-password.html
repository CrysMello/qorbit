<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha — Qorbit</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0A0E1A 0%, #0D1B2A 50%, #0A1628 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }
        .card {
            width: 100%; max-width: 420px;
            background: rgba(17,24,39,0.95);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 16px; padding: 2.5rem 2rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #6366F1, #818CF8);
            border-radius: 12px; margin-bottom: 0.5rem;
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        }
        .logo-icon svg { width: 26px; height: 26px; fill: white; }
        .logo-name { font-size: 1.4rem; font-weight: 700; color: #F9FAFB; }
        .logo-name span { color: #6366F1; }
        .heading { text-align: center; margin-bottom: 1.5rem; }
        .heading h1 { font-size: 1.2rem; font-weight: 600; color: #F9FAFB; margin-bottom: 0.35rem; }
        .heading p { font-size: 0.875rem; color: #6B7280; }
        .alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; }
        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.8125rem; color: #9CA3AF; margin-bottom: 0.4rem; }
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%; padding: 0.65rem 0.875rem;
            background: #1F2937; border: 1px solid #374151;
            border-radius: 8px; color: #F9FAFB; font-size: 0.9375rem;
            outline: none; transition: border-color 0.15s;
        }
        .form-input:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .form-input.with-toggle { padding-right: 2.75rem; }
        .toggle-password {
            position: absolute; right: 0.875rem; top: 50%;
            transform: translateY(-50%); background: none; border: none;
            color: #6B7280; cursor: pointer; padding: 0;
        }
        .toggle-password:hover { color: #9CA3AF; }
        .requirements {
            font-size: 0.75rem; color: #6B7280;
            margin-top: 0.35rem; line-height: 1.5;
        }
        .btn-primary {
            width: 100%; padding: 0.75rem; margin-top: 0.75rem;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: white; border: none; border-radius: 8px;
            font-size: 0.9375rem; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 14px rgba(99,102,241,0.35);
            transition: opacity 0.15s;
        }
        .btn-primary:hover { opacity: 0.92; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="logo-name">Q<span>orbit</span></div>
    </div>

    <div class="heading">
        <h1>Criar nova senha</h1>
        <p>Escolha uma senha forte para proteger sua conta</p>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/auth/reset-password}" method="post"
          th:object="${resetRequest}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{token}"/>

        <div class="form-group">
            <label class="form-label">Nova senha</label>
            <div class="input-wrapper">
                <input id="newPwd" type="password" class="form-input with-toggle"
                       th:field="*{password}" placeholder="Mínimo 8 caracteres"
                       autofocus autocomplete="new-password" required/>
                <button type="button" class="toggle-password"
                        onclick="togglePassword('newPwd')" tabindex="-1">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="requirements">Mínimo 8 caracteres</div>
        </div>

        <div class="form-group">
            <label class="form-label">Confirmar nova senha</label>
            <div class="input-wrapper">
                <input id="newPwd2" type="password" class="form-input with-toggle"
                       th:field="*{passwordConfirm}" placeholder="Repita a senha"
                       autocomplete="new-password" required/>
                <button type="button" class="toggle-password"
                        onclick="togglePassword('newPwd2')" tabindex="-1">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary">Salvar nova senha</button>
    </form>
</div>
<script>
    function togglePassword(id) {
        const f = document.getElementById(id);
        f.type = f.type === 'text' ? 'password' : 'text';
    }
</script>
</body>
</html>
