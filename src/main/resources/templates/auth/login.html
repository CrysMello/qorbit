<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Qorbit</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0A0E1A 0%, #0D1B2A 50%, #0A1628 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }

        /* Partículas decorativas */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(99,102,241,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16,185,129,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(99,102,241,0.05);
            position: relative;
            z-index: 1;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #6366F1, #818CF8);
            border-radius: 14px;
            margin-bottom: 0.75rem;
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        }
        .logo-icon svg { width: 28px; height: 28px; fill: white; }
        .logo-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #F9FAFB;
            letter-spacing: -0.02em;
        }
        .logo-name span { color: #6366F1; }

        /* Heading */
        .heading {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .heading h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #F9FAFB;
            margin-bottom: 0.35rem;
        }
        .heading p {
            font-size: 0.875rem;
            color: #6B7280;
        }

        /* Steps */
        .step { display: none; }
        .step.active { display: block; }

        /* Alerts */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        .alert-error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #FCA5A5;
        }
        .alert-success {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            color: #6EE7B7;
        }
        .alert-info {
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.3);
            color: #A5B4FC;
        }

        /* Form */
        .form-group { margin-bottom: 1.1rem; }
        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: #9CA3AF;
            margin-bottom: 0.4rem;
        }
        .form-input {
            width: 100%;
            padding: 0.65rem 0.875rem;
            background: #1F2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #F9FAFB;
            font-size: 0.9375rem;
            transition: border-color 0.15s, box-shadow 0.15s;
            outline: none;
        }
        .form-input:focus {
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .form-input::placeholder { color: #4B5563; }
        .form-input:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Password toggle */
        .input-wrapper { position: relative; }
        .toggle-password {
            position: absolute;
            right: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6B7280;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .toggle-password:hover { color: #9CA3AF; }

        /* Remember + Forgot */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8125rem;
            color: #9CA3AF;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #6366F1;
        }
        .link {
            font-size: 0.8125rem;
            color: #6366F1;
            text-decoration: none;
            transition: color 0.15s;
        }
        .link:hover { color: #818CF8; text-decoration: underline; }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
            box-shadow: 0 4px 14px rgba(99,102,241,0.35);
            position: relative;
        }
        .btn-primary:hover:not(:disabled) {
            opacity: 0.92;
            box-shadow: 0 6px 20px rgba(99,102,241,0.45);
        }
        .btn-primary:active:not(:disabled) { transform: scale(0.99); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }

        /* Divider */
        .divider {
            text-align: center;
            margin: 1.25rem 0;
            position: relative;
            font-size: 0.8125rem;
            color: #4B5563;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #1F2937;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        /* Footer */
        .card-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8125rem;
            color: #6B7280;
        }

        /* MFA digits */
        .mfa-code {
            text-align: center;
            letter-spacing: 0.5rem;
            font-size: 1.5rem;
            font-family: monospace;
            font-weight: 700;
        }
        .mfa-hint {
            font-size: 0.8rem;
            color: #6B7280;
            text-align: center;
            margin-top: 0.75rem;
        }
        .back-link {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8125rem;
            color: #6B7280;
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: color 0.15s;
        }
        .back-link:hover { color: #9CA3AF; }
    </style>
</head>
<body>
<div class="card" id="authCard">

    <!-- Logo -->
    <div class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="logo-name">Q<span>orbit</span></div>
    </div>

    <!-- STEP 1: Login -->
    <div class="step active" id="step-login">

        <div class="heading">
            <h1>Bem-vindo de volta</h1>
            <p>Entre com suas credenciais para continuar</p>
        </div>

        <!-- Alertas -->
        <div th:if="${error}" class="alert alert-error" id="errorAlert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${info}" class="alert alert-info">
            <span th:text="${info}"></span>
        </div>

        <!-- Formulário -->
        <form id="loginForm" th:action="@{/auth/login}" method="post"
              th:object="${loginRequest}" onsubmit="handleSubmit(this)">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label class="form-label" for="email">E-mail</label>
                <input id="email" type="email" class="form-input" th:field="*{email}"
                       placeholder="seu@email.com" autofocus autocomplete="email" required/>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Senha</label>
                <div class="input-wrapper">
                    <input id="password" type="password" class="form-input" th:field="*{password}"
                           placeholder="••••••••" autocomplete="current-password" required
                           style="padding-right:2.75rem"/>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)" tabindex="-1">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <label class="checkbox-label">
                    <input type="checkbox" th:field="*{rememberMe}"/>
                    Lembrar-me
                </label>
                <a href="/auth/forgot-password" class="link">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">Entrar</button>
        </form>

        <div class="card-footer">
            Não tem conta? <a href="/auth/register" class="link">Criar conta</a>
        </div>
    </div>

    <!-- STEP 2: MFA (mostrado se mfaPending=true) -->
    <div class="step" id="step-mfa" th:classappend="${mfaPending} ? ' active' : ''">
        <a href="/auth/login" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            Voltar ao login
        </a>

        <div class="heading">
            <h1>Verificação em 2 etapas</h1>
            <p>Digite o código de 6 dígitos do seu aplicativo autenticador</p>
        </div>

        <div th:if="${mfaError}" class="alert alert-error">
            <span th:text="${mfaError}"></span>
        </div>

        <form th:action="@{/auth/mfa}" method="post" onsubmit="handleSubmit(this)">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="useBackupCode" id="useBackupCode" value="false"/>

            <div class="form-group">
                <label class="form-label" style="text-align:center;display:block">Código de verificação</label>
                <input id="mfaCode" type="text" name="code" class="form-input mfa-code"
                       placeholder="000000" maxlength="8" autofocus
                       autocomplete="one-time-code" inputmode="numeric" required/>
            </div>

            <button type="submit" class="btn-primary">Verificar</button>

            <div class="mfa-hint">
                Sem acesso ao app?
                <a href="#" class="link" onclick="useBackup()">Usar código de backup</a>
            </div>
        </form>
    </div>

</div>

<script>
    function handleSubmit(form) {
        const btn = form.querySelector('.btn-primary');
        if (btn) {
            btn.disabled = true;
            btn.classList.add('loading');
        }
    }

    function togglePassword(fieldId, btn) {
        const field = document.getElementById(fieldId);
        if (!field) return;
        const isText = field.type === 'text';
        field.type = isText ? 'password' : 'text';
        btn.innerHTML = isText
            ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
            : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    }

    function useBackup() {
        document.getElementById('useBackupCode').value = 'true';
        const codeInput = document.getElementById('mfaCode');
        if (codeInput) {
            codeInput.placeholder = 'XXXXXXXX';
            codeInput.inputMode = 'text';
            codeInput.maxLength = 10;
        }
        const hint = document.querySelector('.mfa-hint');
        if (hint) hint.textContent = 'Digite um dos seus códigos de backup de 8 caracteres.';
    }

    // Shake no card se há erro
    document.addEventListener('DOMContentLoaded', () => {
        if (document.getElementById('errorAlert')) {
            document.getElementById('authCard').classList.add('shake');
        }
        // Auto-foco no primeiro campo vazio
        const first = document.querySelector('.form-input:not([type="hidden"])');
        if (first && !first.value) first.focus();
    });

    // Enter submete o formulário ativo
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const activeStep = document.querySelector('.step.active');
            if (activeStep) {
                const form = activeStep.querySelector('form');
                if (form) form.requestSubmit();
            }
        }
    });
</script>
</body>
</html>
