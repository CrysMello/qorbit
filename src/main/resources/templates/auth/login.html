<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Qorbit</title>
    <!-- Força carregamento do token CSRF antes do buffer do response ser commitado pelo CSS inline -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue:        #3B82F6;
            --blue-dark:   #1D4ED8;
            --blue-light:  #60A5FA;
            --blue-glow:   rgba(59, 130, 246, 0.45);
            --glass-bg:    rgba(6, 12, 30, 0.72);
            --glass-border:rgba(59, 130, 246, 0.22);
            --surface:     rgba(12, 20, 45, 0.85);
            --text-1:      #EFF6FF;
            --text-2:      #93C5FD;
            --text-3:      #64748B;
            --red:         #F87171;
            --green:       #34D399;
            --font:        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
        }

        html, body { min-height: 100vh; overflow-x: hidden; }

        body {
            font-family: var(--font);
            background: #020817;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* ── Canvas starfield ── */
        #starCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ── Nebula overlays ── */
        .nebula {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(80px);
        }
        .nebula-1 {
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(29,78,216,.18) 0%, transparent 70%);
            top: -200px; left: -200px;
            animation: pulse 9s ease-in-out infinite;
        }
        .nebula-2 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, rgba(109,40,217,.12) 0%, transparent 70%);
            bottom: -150px; right: -150px;
            animation: pulse 11s ease-in-out infinite 2s reverse;
        }
        .nebula-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(59,130,246,.10) 0%, transparent 70%);
            top: 40%; right: 10%;
            animation: pulse 13s ease-in-out infinite 5s;
        }
        @keyframes pulse {
            0%, 100% { opacity: .7; transform: scale(1); }
            50%       { opacity: 1; transform: scale(1.08); }
        }

        /* ── Layout ── */
        .page-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.75rem;
        }

        /* ── Logo header (fora do card) ── */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .75rem;
        }
        .brand-icon {
            width: 60px; height: 60px;
            position: relative;
        }
        .brand-icon svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 12px var(--blue-glow));
        }
        .brand-name {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -.03em;
            color: var(--text-1);
            text-shadow: 0 0 24px rgba(59,130,246,.5);
        }
        .brand-name span { color: var(--blue-light); }

        /* ── Card ── */
        .card {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.25rem 2rem 2rem;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 0 0 1px rgba(59,130,246,.08),
                0 30px 60px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.04);
            animation: cardIn .5s cubic-bezier(.22,.68,0,1.2) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(.98); }
            to   { opacity: 1; transform: none; }
        }

        /* ── Card heading ── */
        .card-heading { text-align: center; margin-bottom: 1.75rem; }
        .card-heading h1 {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: .3rem;
            letter-spacing: -.02em;
        }
        .card-heading p {
            font-size: .875rem;
            color: var(--text-3);
        }

        /* ── Alerts ── */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: .5rem;
            padding: .75rem 1rem;
            border-radius: 10px;
            font-size: .8375rem;
            margin-bottom: 1.25rem;
            line-height: 1.45;
        }
        .alert svg { flex-shrink: 0; margin-top: .1rem; }
        .alert-error   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.28);  color: #FCA5A5; }
        .alert-success { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.28); color: #6EE7B7; }
        .alert-info    { background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.28); color: var(--blue-light); }

        /* ── Form ── */
        .form-group { margin-bottom: 1.1rem; }
        .form-label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: .45rem;
            letter-spacing: .01em;
        }

        /* Input com ícone */
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute;
            left: .9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            pointer-events: none;
            transition: color .2s;
        }
        .input-wrap:focus-within .input-icon { color: var(--blue-light); }

        .form-input {
            width: 100%;
            padding: .7rem .875rem .7rem 2.65rem;
            background: var(--surface);
            border: 1px solid rgba(71,85,105,.5);
            border-radius: 10px;
            color: var(--text-1);
            font-size: .9375rem;
            font-family: var(--font);
            transition: border-color .2s, box-shadow .2s;
            outline: none;
        }
        .form-input::placeholder { color: var(--text-3); }
        .form-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,.18), 0 0 12px rgba(59,130,246,.12);
        }
        .form-input.has-toggle { padding-right: 2.75rem; }

        /* Toggle senha */
        .toggle-password {
            position: absolute;
            right: .875rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color .2s;
        }
        .toggle-password:hover { color: var(--blue-light); }

        /* Row remember + forgot */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.4rem;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: .45rem;
            font-size: .8125rem;
            color: var(--text-3);
            cursor: pointer;
            user-select: none;
        }
        .checkbox-label input[type="checkbox"] {
            width: 15px; height: 15px;
            accent-color: var(--blue);
            cursor: pointer;
        }
        .link {
            font-size: .8125rem;
            color: var(--blue-light);
            text-decoration: none;
            transition: color .2s, text-shadow .2s;
        }
        .link:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--blue-glow);
        }

        /* ── Botão principal ── */
        .btn-primary {
            width: 100%;
            padding: .78rem;
            background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 60%, var(--blue-light) 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: .9375rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: box-shadow .25s, transform .1s;
            box-shadow: 0 4px 18px rgba(59,130,246,.4), 0 0 0 1px rgba(59,130,246,.25);
            letter-spacing: .01em;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.12), transparent);
            opacity: 0;
            transition: opacity .25s;
        }
        .btn-primary:hover:not(:disabled)::before { opacity: 1; }
        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 28px rgba(59,130,246,.6), 0 0 20px rgba(59,130,246,.3);
            transform: translateY(-1px);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0) scale(.99); }
        .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

        /* Spinner no botão */
        .btn-primary .spinner {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .6s linear infinite;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
        }
        .btn-primary.loading .spinner { display: block; }
        @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

        /* ── Rodapé do card ── */
        .card-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .8125rem;
            color: var(--text-3);
        }

        /* ── Shake animation (erro) ── */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake { animation: shake .4s ease; }

        /* ── Divisor de seções ── */
        .section-divider {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin: 1.25rem 0;
            color: var(--text-3);
            font-size: .75rem;
        }
        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(71,85,105,.4);
        }

        /* ── MFA step (oculto por padrão) ── */
        .step { display: none; }
        .step.active { display: block; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            font-size: .8125rem;
            color: var(--text-3);
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: color .2s;
        }
        .back-link:hover { color: var(--text-2); }

        .mfa-input {
            text-align: center;
            letter-spacing: .5rem;
            font-size: 1.6rem;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            padding-left: 2.15rem;  /* corrige centralização com letter-spacing */
        }
        .mfa-hint {
            font-size: .8rem;
            color: var(--text-3);
            text-align: center;
            margin-top: .875rem;
        }

        /* ── Responsivo ── */
        @media (max-width: 480px) {
            .card { padding: 1.75rem 1.25rem 1.5rem; border-radius: 16px; }
            .brand-name { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<!-- Fundo espacial -->
<canvas id="starCanvas"></canvas>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<div class="page-wrapper">

    <!-- Logo -->
    <div class="brand">
        <div class="brand-icon">
            <!-- Ícone orbital SVG -->
            <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Órbita externa -->
                <ellipse cx="30" cy="30" rx="27" ry="11"
                         stroke="#3B82F6" stroke-width="1.5" opacity=".7"
                         transform="rotate(-30 30 30)"/>
                <!-- Órbita interna -->
                <ellipse cx="30" cy="30" rx="27" ry="11"
                         stroke="#60A5FA" stroke-width="1.5" opacity=".55"
                         transform="rotate(30 30 30)"/>
                <!-- Anel equatorial -->
                <ellipse cx="30" cy="30" rx="27" ry="5"
                         stroke="#93C5FD" stroke-width="1" opacity=".35"/>
                <!-- Núcleo -->
                <circle cx="30" cy="30" r="5"
                        fill="url(#coreGrad)"
                        filter="url(#glow)"/>
                <!-- Satélite na órbita externa -->
                <circle cx="49" cy="24.5" r="2.2"
                        fill="#60A5FA" opacity=".9"
                        filter="url(#glow)"/>
                <defs>
                    <radialGradient id="coreGrad" cx="35%" cy="35%">
                        <stop offset="0%" stop-color="#93C5FD"/>
                        <stop offset="100%" stop-color="#1D4ED8"/>
                    </radialGradient>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="2.5" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>
            </svg>
        </div>
        <div class="brand-name">Q<span>orbit</span></div>
    </div>

    <!-- Card -->
    <div class="card" id="authCard">

        <!-- ── STEP: Login ─────────────────────────────────────── -->
        <div class="step active" id="step-login">

            <div class="card-heading">
                <h1>Bem-vindo de volta!</h1>
                <p>Faça login na sua conta</p>
            </div>

            <!-- Alertas -->
            <div th:if="${error}" class="alert alert-error" id="errorAlert">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span th:text="${error}"></span>
            </div>
            <div th:if="${success}" class="alert alert-success">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${info}" class="alert alert-info">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span th:text="${info}"></span>
            </div>

            <!-- Formulário -->
            <form id="loginForm" th:action="@{/auth/login}" method="post"
                  th:object="${loginRequest}" onsubmit="handleSubmit(this)">

                <!-- E-mail -->
                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </span>
                        <input id="email" type="email" class="form-input"
                               th:field="*{email}"
                               placeholder="seuemail@dominio.com"
                               autofocus autocomplete="email" required/>
                    </div>
                </div>

                <!-- Senha -->
                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input id="password" type="password" class="form-input has-toggle"
                               th:field="*{password}"
                               placeholder="••••••••"
                               autocomplete="current-password" required/>
                        <button type="button" class="toggle-password"
                                onclick="togglePassword('password', this)" tabindex="-1"
                                aria-label="Mostrar/ocultar senha">
                            <!-- ícone olho -->
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Lembrar-me / Esqueci -->
                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" th:field="*{rememberMe}"/>
                        Lembrar-me
                    </label>
                    <a th:href="@{/auth/forgot-password}" class="link">Esqueceu sua senha?</a>
                </div>

                <!-- Botão entrar -->
                <button type="submit" class="btn-primary" id="loginBtn">
                    Entrar
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="card-footer">
                Não tem uma conta?&nbsp;<a th:href="@{/auth/register}" class="link">Cadastre-se</a>
            </div>

        </div><!-- /step-login -->

        <!-- ── STEP: MFA (ativado pelo backend quando mfaPending=true) ─── -->
        <div class="step" id="step-mfa" th:classappend="${mfaPending} ? ' active' : ''">

            <a th:href="@{/auth/login}" class="back-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                Voltar ao login
            </a>

            <div class="card-heading">
                <h1>Verificação em 2 etapas</h1>
                <p>Digite o código de 6 dígitos do seu app autenticador</p>
            </div>

            <div th:if="${mfaError}" class="alert alert-error">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span th:text="${mfaError}"></span>
            </div>

            <form th:action="@{/auth/mfa}" method="post" onsubmit="handleSubmit(this)">
                <input type="hidden" name="useBackupCode" id="useBackupCode" value="false"/>

                <div class="form-group">
                    <label class="form-label" style="text-align:center;display:block">Código de verificação</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="2" width="14" height="20" rx="2"/>
                                <line x1="12" y1="18" x2="12.01" y2="18"/>
                            </svg>
                        </span>
                        <input id="mfaCode" type="text" name="code"
                               class="form-input mfa-input"
                               placeholder="000000"
                               maxlength="8" autofocus
                               autocomplete="one-time-code" inputmode="numeric" required/>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Verificar
                    <span class="spinner"></span>
                </button>

                <p class="mfa-hint">
                    Sem acesso ao app?
                    <a href="#" class="link" onclick="useBackup(event)">Usar código de backup</a>
                </p>
            </form>

        </div><!-- /step-mfa -->

    </div><!-- /card -->

</div><!-- /page-wrapper -->

<script>
/* ── Starfield ── */
(function () {
    const canvas = document.getElementById('starCanvas');
    const ctx    = canvas.getContext('2d');
    let W, H, stars;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        initStars();
    }

    function rand(min, max) { return Math.random() * (max - min) + min; }

    function initStars() {
        const count = Math.floor((W * H) / 3200);
        stars = Array.from({ length: count }, () => ({
            x:  rand(0, W),
            y:  rand(0, H),
            r:  rand(.3, 1.6),
            a:  rand(.2, 1),
            da: rand(.0003, .0012) * (Math.random() < .5 ? 1 : -1),
            vx: rand(-.04, .04),
            vy: rand(-.04, .04),
        }));
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
            s.a += s.da;
            if (s.a <= .15 || s.a >= 1) s.da = -s.da;
            s.x += s.vx;
            s.y += s.vy;
            if (s.x < 0) s.x = W;
            if (s.x > W) s.x = 0;
            if (s.y < 0) s.y = H;
            if (s.y > H) s.y = 0;

            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(200,220,255,${s.a})`;
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
})();

/* ── Shake no card se há erro ── */
document.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('errorAlert')) {
        document.getElementById('authCard').classList.add('shake');
        setTimeout(() => document.getElementById('authCard').classList.remove('shake'), 500);
    }
});

/* ── Submit com loading ── */
function handleSubmit(form) {
    const btn = form.querySelector('.btn-primary');
    if (btn) {
        btn.disabled = true;
        btn.classList.add('loading');
    }
}

/* ── Toggle show/hide senha ── */
const EYE_OPEN  = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_CLOSE = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

function togglePassword(id, btn) {
    const field = document.getElementById(id);
    if (!field) return;
    const show = field.type === 'password';
    field.type    = show ? 'text' : 'password';
    btn.innerHTML = show ? EYE_CLOSE : EYE_OPEN;
    btn.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
}

/* ── MFA backup ── */
function useBackup(e) {
    e.preventDefault();
    document.getElementById('useBackupCode').value = 'true';
    const inp = document.getElementById('mfaCode');
    if (inp) {
        inp.placeholder  = 'XXXXXXXX';
        inp.inputMode    = 'text';
        inp.maxLength    = 10;
        inp.style.letterSpacing = '.25rem';
    }
    e.target.closest('.mfa-hint').textContent = 'Digite um código de backup de 8 caracteres.';
}
</script>
