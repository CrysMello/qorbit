<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Evidências — Qorbit</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        .thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
        .thumb{border-radius:6px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
        .thumb:hover{border-color:var(--blue)}
        .thumb-img{height:100px;background:var(--bg-surface);display:flex;align-items:center;justify-content:center;overflow:hidden}
        .thumb-img img{width:100%;height:100%;object-fit:cover}
        .thumb-info{padding:8px 10px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
        .thumb.falhou .thumb-img{background:var(--red-bg)}
        .thumb.falhou{border-color:var(--red-border)}
        .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center}
        .lightbox.open{display:flex}
        .lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,.6)}
        .lightbox-close{position:absolute;top:20px;right:28px;color:var(--text-1);font-size:28px;cursor:pointer}
    </style>
</head>
<body>
<div class="app-layout">
    
    <div th:replace="~{fragments/sidebar :: sidebar('evidencias')}" ></div>

    <main class="main-content">
        <div class="topbar">
            <div>
                <h1 class="topbar-title">Evidências</h1>
                <span class="topbar-sub" id="subTitle">Selecione uma execução</span>
            </div>
            <div class="topbar-actions">
                <button class="btn" id="btnDownload" onclick="downloadEvidencias()" style="display:none">
                    Baixar .zip
                </button>
                <button class="btn btn-primary" id="btnCodigo" onclick="gerarCodigo()" style="display:none">
                    Exportar código Cucumber
                </button>
            </div>
        </div>

        <div class="content">

            <!-- Seletor de execução -->
            <div class="card filter-bar">
                <label style="font-size:12px;color:var(--text-3);white-space:nowrap">Execução:</label>
                <select id="selectExecucao" class="input" onchange="carregarEvidencias(this.value)">
                    <option value="">Selecione uma execução...</option>
                </select>
                <div class="filter-tabs" id="filtroStatus" style="display:none;gap:6px;display:flex">
                    <button class="btn btn-sm active-filter" data-filtro="" onclick="filtrarStatus('',this)">Todos</button>
                    <button class="btn btn-sm" data-filtro="PASSOU" onclick="filtrarStatus('PASSOU',this)">Passou</button>
                    <button class="btn btn-sm" data-filtro="FALHOU" onclick="filtrarStatus('FALHOU',this)" style="color:var(--red)">Falhou</button>
                </div>
            </div>

            <!-- Resumo -->
            <div id="resumoExecucao" class="metrics-row" style="display:none">
                <div class="metric-card">
                    <span class="metric-label">Total de steps</span>
                    <span class="metric-value" id="mTotal">0</span>
                </div>
                <div class="metric-card" style="background:var(--green-bg);border-color:var(--green-border)">
                    <span class="metric-label" style="color:var(--green)">Passou</span>
                    <span class="metric-value" style="color:var(--green)" id="mPassou">0</span>
                </div>
                <div class="metric-card" style="background:var(--red-bg);border-color:var(--red-border)">
                    <span class="metric-label" style="color:var(--red)">Falhou</span>
                    <span class="metric-value" style="color:var(--red)" id="mFalhou">0</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">% Sucesso</span>
                    <span class="metric-value" id="mPct">—</span>
                </div>
            </div>

            <!-- Grid de evidências -->
            <div class="card">
                <div id="thumbGrid" class="thumb-grid">
                    <p class="text-muted text-sm text-center" style="padding:40px;grid-column:1/-1">
                        Selecione uma execução para visualizar as evidências.
                    </p>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="fecharLightbox()">
    <span class="lightbox-close">✕</span>
    <img id="lightboxImg" src="" alt="Evidência"/>
</div>

<script src="/js/app.js"></script>
<script src="/js/evidencias.js"></script>
</body>
</html>
