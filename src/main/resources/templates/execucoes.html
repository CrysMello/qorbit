<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Execuções — Qorbit</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="app-layout">
    
    <div th:replace="~{fragments/sidebar :: sidebar('execucoes')}" ></div>

    <main class="main-content">
        <div class="topbar">
            <div>
                <h1 class="topbar-title">Histórico de Execuções</h1>
                <span class="topbar-sub">Todas as execuções realizadas</span>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-danger"
                        onclick="limparAguardando()">🗑 Limpar pendentes</button>
                <a href="/nova-execucao" class="btn btn-primary">+ Nova execução</a>
            </div>
        </div>

        <div class="content">
            <div class="card" style="padding:0">
                <table class="table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>URL</th>
                            <th>Browser</th>
                            <th>Status</th>
                            <th>Passou</th>
                            <th>Falhou</th>
                            <th>% Sucesso</th>
                            <th>Duração</th>
                            <th>Iniciado em</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="exec : ${execucoes}" th:attr="data-execucao-id=${exec.id}">
                            <td th:text="${exec.id}"></td>
                            <td class="url-cell" th:text="${exec.urlAlvo}"></td>
                            <td th:text="${exec.browser ?: 'chrome'}"></td>
                            <td>
                                <span class="badge" data-col="status"
                                      th:classappend="${exec.status == 'CONCLUIDO'} ? 'badge-success'
                                                    : (${exec.status == 'ERRO'} ? 'badge-danger'
                                                    : (${exec.status == 'RODANDO'} ? 'badge-info' : 'badge-warning'))"
                                      th:text="${exec.status}"></span>
                            </td>
                            <td data-col="passou" th:text="${exec.stepsPAssou ?: 0}"></td>
                            <td data-col="falhou" th:text="${exec.stepsFalhou ?: 0}"></td>
                            <td data-col="percentualSucesso" th:text="${exec.percentualSucesso != null}
                                ? ${#numbers.formatDecimal(exec.percentualSucesso,1,0)} + '%' : '—'"></td>
                            <td data-col="duracao" th:text="${exec.tempoExecucaoSegundos != null}
                                ? ${exec.tempoExecucaoSegundos} + 's' : '—'"></td>
                            <td th:text="${exec.iniciadoEm != null ? #strings.substring(exec.iniciadoEm, 0, 16) : '—'}"></td>
                            <td>
                                <a th:href="@{/evidencias(execucaoId=${exec.id})}"
                                   class="btn btn-sm">Evidências</a>
                                <button class="btn btn-sm"
                                        th:onclick="'gerarCodigo(' + ${exec.id} + ')'"
                                        style="margin-left:4px">Baixar código</button>
                                <button class="btn btn-sm"
                                        th:onclick="'deletarExecucao(' + ${exec.id} + ')'"
                                        style="margin-left:4px;color:var(--red)"
                                        title="Remover esta execução">✕</button>
                            </td>
                        </tr>
                        <tr th:if="${execucoes.isEmpty()}">
                            <td colspan="10" class="text-center text-muted" style="padding:40px">
                                Nenhuma execução registrada ainda.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="/js/app.js"></script>

<!-- Modal: seleccionar suite para execução -->
<div id="modalSuiteExec" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center">
    <div style="background:var(--bg);border-radius:12px;border:1px solid var(--border);padding:1.5rem;width:340px;max-width:95vw">
        <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem">Adicionar à suite</div>
        <div id="suitesListModal" style="max-height:260px;overflow-y:auto;margin-bottom:1rem"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;padding-top:.75rem;border-top:1px solid var(--border)">
            <button class="btn" onclick="fecharModalSuite()">Cancelar</button>
            <button class="btn btn-primary" onclick="confirmarAdicionarSuite()">Confirmar</button>
        </div>
    </div>
</div>
<script>
checkSeleniumStatus();

async function deletarExecucao(id) {
    if (!confirm('Remover execução #' + id + '?')) return;
    try {
        await api('DELETE', '/api/execucoes/' + id);
        toast('Execução #' + id + ' removida', 'success');
        setTimeout(() => location.reload(), 800);
    } catch (e) { toast('Erro: ' + e.message, 'danger'); }
}

async function limparAguardando() {
    if (!confirm('Isso irá remover TODOS os dados: execuções, elementos capturados e casos de teste. Confirmar?')) return;
    try {
        const res = await api('DELETE', '/api/execucoes/limpar/aguardando');
        toast(res.mensagem, 'success');
        setTimeout(() => location.reload(), 800);
    } catch (e) { toast('Erro: ' + e.message, 'danger'); }
}
async function gerarCodigo(execucaoId) {
    try {
        const res = await fetch('/api/codigo/gerar', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ idsCasos: [] })
        });
        if (res.ok) {
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'qorbit-tests-export.zip'; a.click();
        }
    } catch(e) { toast('Erro: ' + e.message, 'danger'); }
}
refreshExecucoesViews();
setInterval(refreshExecucoesViews, 3000);
</script>
<script>
let execIdParaSuite = null;
let suiteIdSelecionada = null;

async function abrirModalSuite(execId) {
    execIdParaSuite = execId;
    suiteIdSelecionada = null;
    const modal = document.getElementById('modalSuiteExec');
    modal.style.display = 'flex';
    try {
        const suites = await api('GET', '/api/suites');
        const lista = document.getElementById('suitesListModal');
        if (!suites || suites.length === 0) {
            lista.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:.5rem">Nenhuma suite criada ainda. <a href="/suites">Criar suite</a></p>';
            return;
        }
        lista.innerHTML = suites.map(s => `
            <div onclick="selecionarSuiteModal(this,${s.id})"
                 style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer">
                <div style="width:10px;height:10px;border-radius:50%;background:${corDot(s.cor)};flex-shrink:0"></div>
                <span style="font-size:13px;color:var(--text);flex:1">${s.nome}</span>
                <span style="font-size:11px;color:var(--text-muted)">${s.totalCasos} casos</span>
            </div>
        `).join('') + `
            <div onclick="window.location='/suites'"
                 style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--border);border-radius:6px;cursor:pointer;margin-top:4px">
                <span style="font-size:12px;color:var(--text-muted)">+ criar nova suite</span>
            </div>`;
    } catch(e) { toast('Erro ao carregar suites', 'danger'); }
}

function corDot(cor) {
    const cores = {green:'#639922',blue:'#378ADD',amber:'#BA7517',purple:'#7F77DD',coral:'#D85A30'};
    return cores[cor] || '#639922';
}

function selecionarSuiteModal(el, id) {
    document.querySelectorAll('#suitesListModal div').forEach(d => d.style.borderColor = 'var(--border)');
    el.style.borderColor = '#534AB7';
    el.style.background = '#EEEDFE';
    suiteIdSelecionada = id;
}

function fecharModalSuite() {
    document.getElementById('modalSuiteExec').style.display = 'none';
}

async function confirmarAdicionarSuite() {
    if (!suiteIdSelecionada) { toast('Seleccione uma suite.', 'danger'); return; }
    try {
        const res = await api('POST', '/api/suites/' + suiteIdSelecionada + '/execucao/' + execIdParaSuite);
        toast(res.mensagem, 'success');
        fecharModalSuite();
    } catch(e) { toast(e.message || 'Erro ao adicionar à suite', 'danger'); }
}
</script>
</body>
</html>
