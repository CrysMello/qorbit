<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Biblioteca de Elementos — Qorbit</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
<style>
        .nav-item { border-left: 3px solid transparent !important; }
        .nav-item.active { border-left: 3px solid #4F9CF9 !important; background: rgba(79,156,249,.1) !important; }
        .nav-item:hover { background: rgba(255,255,255,.06) !important; }
        </style>
</head>
<body>
<div class="app-layout">
    
    <div th:replace="~{fragments/sidebar :: sidebar('elementos')}" ></div>

    <main class="main-content">
        <div class="topbar">
            <div>
                <h1 class="topbar-title">Biblioteca de Elementos (POM)</h1>
                <span class="topbar-sub" id="totalLabel">Carregando...</span>
            </div>
            <div class="topbar-actions">
                <button class="btn" onclick="document.getElementById('formCaptura').classList.toggle('hidden')">
                    Capturar da URL
                </button>
                <button class="btn btn-primary" onclick="abrirFormAdicionar()">+ Novo elemento</button>
            </div>
        </div>

        <div class="content">

            <!-- Captura automática -->
            <div class="card hidden" id="formCaptura">
                <div class="card-title">Captura automática (Canal 1)</div>
                <div class="form-row">
                    <input type="url" id="urlCaptura" class="input" placeholder="https://app.suaempresa.com.br/pagina" style="flex:1"/>
                    <button class="btn btn-primary" onclick="capturarElementos()">Capturar</button>
                </div>
                <p class="helper-text">O Qorbit abrirá a URL e extrairá todos os elementos interativos automaticamente.</p>
            </div>

            <!-- Filtros -->
            <div class="card filter-bar">
                <input type="text" id="filtroBusca" class="input" placeholder="Buscar por nome lógico ou seletor..." oninput="filtrar()"/>
                <select id="filtroPagina" class="input" onchange="filtrar()">
                    <option value="">Página: Todas</option>
                </select>
                <select id="filtroStatus" class="input" onchange="filtrar()">
                    <option value="">Status: Todos</option>
                    <option value="ATIVO">Ativo</option>
                    <option value="PENDENTE">Pendente</option>
                </select>
                <button class="btn" onclick="limparFiltros()">Limpar</button>
            </div>

            <!-- Tabela -->
            <div class="card" style="padding:0">
                <table class="table" id="tabelaElementos">
                    <thead>
                        <tr>
                            <th>Nome lógico</th>
                            <th>Página / Módulo</th>
                            <th>Tipo seletor</th>
                            <th>Seletor técnico</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyElementos">
                        <tr><td colspan="6" class="text-center">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Formulário adicionar/editar -->
            <div class="card hidden" id="formAdicionar">
                <div class="card-title" id="formTitulo">Adicionar elemento manualmente (Canal 2)</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome lógico *</label>
                        <input type="text" id="fNomeLogico" class="input" placeholder="Ex: BotaoSalvar"/>
                        <span class="field-error hidden" id="errNomeLogico"></span>
                    </div>
                    <div class="form-group">
                        <label>Página / Módulo *</label>
                        <input type="text" id="fPagina" class="input" placeholder="Ex: CadastroCliente" list="listaPaginas"/>
                        <datalist id="listaPaginas"></datalist>
                    </div>
                    <div class="form-group">
                        <label>Tipo de seletor *</label>
                        <select id="fTipoSeletor" class="input">
                            <option value="CSS">CSS Selector</option>
                            <option value="XPATH">XPath</option>
                            <option value="ID">ID</option>
                            <option value="NAME">Name</option>
                            <option value="LINK_TEXT">LinkText</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label>Seletor técnico *</label>
                        <input type="text" id="fSeletor" class="input" placeholder="#btn-salvar-cliente"/>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label>Descrição (opcional)</label>
                        <input type="text" id="fDescricao" class="input" placeholder="Ex: Botão que salva o cadastro"/>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn" onclick="fecharForm()">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarElemento()">Salvar elemento</button>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="/js/app.js"></script>
<script src="/js/elementos.js"></script>
</body>
</html>
