# ── Remember-me ───────────────────────────────────────────
# SEGURANÇA: defina via variável de ambiente QORBIT_REMEMBER_ME_KEY em produção.
qorbit.remember-me.key=${QORBIT_REMEMBER_ME_KEY:dev-only-key-change-in-production}

# ── Autenticação / Segurança ───────────────────────────────
# Sessão: 8 horas de inatividade
server.servlet.session.timeout=480m
# Cookie de sessão com atributos de segurança
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict

# ── E-mail (SMTP) ──────────────────────────────────────────
# Configure via variáveis de ambiente em produção.
# Defina MAIL_USERNAME e MAIL_PASSWORD (use Senha de App do Google, não a senha normal).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:crystianemello@gmail.com}
spring.mail.password=${MAIL_PASSWORD:hzemlzxhdusibfat}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
# URL base para links nos e-mails
qorbit.app.base-url=${APP_URL:http://localhost:8080}
# Habilita envio real de e-mails (false = apenas loga no console)
qorbit.mail.enabled=${MAIL_ENABLED:true}

# ── MFA (TOTP) ─────────────────────────────────────────────
qorbit.mfa.issuer=Qorbit
qorbit.mfa.backup-codes-count=8

# ── Rate Limiting ──────────────────────────────────────────
qorbit.auth.max-login-attempts=5
qorbit.auth.lockout-minutes=15
qorbit.auth.rate-limit-per-minute=20

# ── Auditoria ──────────────────────────────────────────────
qorbit.audit.retention-days=90

# ── Bootstrap Super Admin ──────────────────────────────────
# Criado automaticamente na primeira vez que a aplicação sobe (se não existir nenhum SUPER_ADMIN).
# IMPORTANTE: troque a senha no primeiro login ou defina via variável de ambiente.
qorbit.super-admin.email=${QORBIT_SUPER_ADMIN_EMAIL:crystianemello@gmail.com}
qorbit.super-admin.name=${QORBIT_SUPER_ADMIN_NAME:Crystiane Mello}
qorbit.super-admin.password=${QORBIT_SUPER_ADMIN_PASSWORD:Qorbit@Admin#2025!}
