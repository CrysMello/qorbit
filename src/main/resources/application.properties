# ── Servidor ──────────────────────────────────────────────
server.port=8080

# ── Banco SQLite embarcado ────────────────────────────────
# Caminho padrão: db/qorbit.db
# Pode ser sobrescrito com a variável de ambiente QORBIT_DB_PATH
qorbit.db.path=${QORBIT_DB_PATH:db/qorbit.db}
qorbit.learning.sqlite.enabled=true
spring.datasource.url=jdbc:sqlite:${qorbit.db.path}?journal_mode=WAL&busy_timeout=30000&synchronous=NORMAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=30000; PRAGMA synchronous=NORMAL;

# ── Upload de arquivos ────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Evidencias e código gerado ────────────────────────────
scanner.evidencias.path=evidencias
scanner.codigo.path=codigo-gerado
scanner.timeout.default=10
scanner.timeout.padrao=10
scanner.step.retry=1

# ── WebDriver ─────────────────────────────────────────────
scanner.webdriver.browser=chrome
scanner.webdriver.headless=false
scanner.browser.fechar=true

# ── Jackson ───────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.mvc.format.date-time=iso
spring.jpa.open-in-view=false

# ── Plugin IA ─────────────────────────────────────────────
scanner.ai.habilitado=${QORBIT_AI_ENABLED:false}
scanner.ai.endpoint=${QORBIT_AI_ENDPOINT:}
scanner.ai.modelo=${QORBIT_AI_MODEL:}
scanner.ai.auth-tipo=${QORBIT_AI_AUTH_TYPE:bearer}
# SEGURANÇA: nunca commitar a chave no repositório.
# Defina via variável de ambiente QORBIT_AI_API_KEY ou ficheiro .env fora do Git.
scanner.ai.api-key=${QORBIT_AI_API_KEY:}

# ── Logging para Diagnóstico SELECT/COMBOBOX ──────────────
logging.level.com.qorbit.engine.strategy=INFO
logging.level.com.qorbit.engine.classification=INFO
logging.level.com.qorbit.engine.strategy.impl.NativeSelectExecutionStrategy=DEBUG
logging.level.com.qorbit.engine.strategy.impl.CustomComboboxExecutionStrategy=DEBUG
logging.level.com.qorbit.engine.strategy.DefaultStrategySelector=DEBUG
logging.level.com.qorbit.engine.classification.DefaultComponentClassifier=DEBUG
scanner.ai.auto-healing=true
scanner.ai.auto-naming=true
scanner.ai.auto-diagnostico=true

# ── Logs ──────────────────────────────────────────────────
scanner.logs.path=logs
