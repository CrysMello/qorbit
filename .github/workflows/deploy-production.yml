name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build package without tests
        run: mvn -B clean package -DskipTests

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PROD_SSH_PORT || '22' }}" "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Verify SSH access
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no -p "${{ secrets.PROD_SSH_PORT || '22' }}" "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" echo SSH_OK

      - name: Copy artifact to server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no -p "${{ secrets.PROD_SSH_PORT || '22' }}" "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" mkdir -p "${{ secrets.PROD_DEPLOY_PATH }}/releases/${{ github.run_id }}"
          scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT || '22' }}" target/*.jar "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/releases/${{ github.run_id }}/"

      - name: Copy deployment script
        run: |
          scp -i ~/.ssh/id_ed25519 -P "${{ secrets.PROD_SSH_PORT || '22' }}" .github/scripts/deploy-production.sh "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/releases/${{ github.run_id }}/"

      - name: Deploy and restart application
        run: |
          RELEASE_DIR="${{ secrets.PROD_DEPLOY_PATH }}/releases/${{ github.run_id }}"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no -p "${{ secrets.PROD_SSH_PORT || '22' }}" "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" "chmod +x '$RELEASE_DIR/deploy-production.sh' && bash '$RELEASE_DIR/deploy-production.sh' '$RELEASE_DIR' '${{ secrets.PROD_DEPLOY_PATH }}' '${{ vars.APP_NAME || 'qorbit-engine' }}' '${{ vars.APP_PORT || '8080' }}' '${{ vars.APP_SERVICE || 'qorbit' }}'"
